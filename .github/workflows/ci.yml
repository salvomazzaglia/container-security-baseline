# GitHub Actions CI — GitHub-hosted runners ONLY
# NEVER use self-hosted runners
# NEVER invoke docker / podman
# NEVER require repository secrets
# NEVER use pull_request_target
#
# External actions are pinned to verified full-length commit SHAs from the
# official action repositories (not forks). Version tags are noted in comments.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests scripts

      - name: Ruff format check
        run: python -m ruff format --check src tests scripts

      - name: mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest --junitxml=test-results/junit.xml

      - name: Generate synthetic demos and sample reports
        run: |
          python scripts/generate-demo-data.py
          python scripts/generate-sample-reports.py

      - name: Validate report schemas
        run: python scripts/validate-schemas.py

      - name: Repository guards
        run: python scripts/repository-guards.py

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results/
            examples/sample-report.json
            examples/sample-report.html
            examples/sample-report.sarif
            examples/sample-remediation.patch
            dist/
          if-no-files-found: ignore
