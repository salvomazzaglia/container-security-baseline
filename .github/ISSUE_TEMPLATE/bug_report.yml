name: Bug report
description: Report a defect in container-security-baseline
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this project.
        Do **not** paste real Compose files, Dockerfiles, credentials, host paths, or registry details.
        Use synthetic or redacted examples only.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps using synthetic or redacted data only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.12.x
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Ubuntu 22.04
        - Ubuntu 24.04
        - Other Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command affected
      options:
        - scan
        - validate
        - list-rules
        - explain
        - suggest
        - compare
        - generate-demo
        - other / library API
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (redacted)
      description: Paste redacted console/report snippets only — no secret values
    validations:
      required: false
