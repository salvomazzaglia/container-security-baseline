# SYNTHETIC mini-project compose for project-root scans.
# Do not run. All names are fake.

services:
  synthetic-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.example.invalid/synthetic-web:1.0.0
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: synthetic
    healthcheck:
      test: ["CMD", "/app/synthetic-app", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend

  synthetic-api:
    image: registry.example.invalid/synthetic-api:latest
    user: root
    ports:
      - "3000:3000"
    environment:
      API_SECRET: SYNTHETIC_NOT_A_REAL_SECRET
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
